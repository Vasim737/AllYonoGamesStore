<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AllYonoGamesStore</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f1117;
color:white;
}

header{
background:#111827;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
color:#ff9800;
}

.telegram{
display:block;
margin:15px;
text-align:center;
background:#229ED9;
padding:15px;
border-radius:10px;
text-decoration:none;
color:white;
font-weight:bold;
}

.search-box{
padding:15px;
}

.search-box input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
}

.apps{
padding:10px;
}

.card{
background:#1c1f2b;
border-radius:15px;
padding:15px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.left{
display:flex;
align-items:center;
gap:10px;
}

.left img{
width:60px;
height:60px;
border-radius:12px;
}

.download{
background:#ff9800;
color:white;
padding:10px 15px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}
</style>
</head>

<body>

<header>AllYonoGamesStore</header>

<a class="telegram" href="https://t.me/AllYonoPiromoCode">
📢 Join Telegram Channel
</a>

<div class="search-box">
<input type="text" id="search" placeholder="Search Apps...">
</div>

<div class="apps" id="appList">

<div class="card">
<div class="left">

<img src="https://i.ibb.co/n8sdQNZc/image-search-1780545492938.jpg" alt="Yono Games">

<div>
<h3>Yono Games</h3>
<p>Bonus ₹199</p>
</div>

</div>

<a class="download"
href="https://yonogames8.com?code=GK1RAMFYWP1&t=1737604037"
target="_blank">
DOWNLOAD
</a>

</div>
<div class="card">
<div class="left">

<img src="https://i.ibb.co/n8sdQNZc/image-search-1780545492938.jpg" alt="Yono Rummy">

<div>
<h3>Yono Rummy</h3>
<p>Bonus ₹149</p>
</div>

</div>

<a class="download"
href="https://yonorummyr.com?code=VIP4WG3WQ3A&t=1737372525"
target="_blank">
DOWNLOAD
</a>

</div>
</div>

<script>
const search = document.getElementById("search");

search.addEventListener("keyup", function(){
let filter = search.value.toLowerCase();
let cards = document.querySelectorAll(".card");

cards.forEach(card=>{
let text = card.innerText.toLowerCase();

card.style.display =
text.includes(filter)
? "flex"
: "none";
});
});
</script>

</body>
</html>
